services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  odoo:
    image: ${ODOO_IMAGE:-odoo:18}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    # WICHTIG: ENV für wait-for-psql.py setzen
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: password
    volumes:
      # Directory-Mount, damit /etc/odoo/odoo.conf als Datei vorhanden ist
      - ./config:/etc/odoo:ro
      # optionale Addons:
      # - ./custom:/mnt/extra-addons:ro
      # - ./enterprise:/mnt/enterprise-addons:ro
    # Offizielles Binary heißt einfach "odoo"
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]

volumes:
  pg_data: {}
