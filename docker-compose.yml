services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  odoo:
    # Standard-Image (du kannst weiterhin ODOO_IMAGE überschreiben, z. B. auf dein eigenes Build)
    image: ${ODOO_IMAGE:-odoo:18}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    # Directory-Mount, damit /etc/odoo/odoo.conf im Container existiert
    volumes:
      - ./config:/etc/odoo:ro
      # Optionale Addons:
      # - ./custom:/mnt/extra-addons:ro
      # - ./enterprise:/mnt/enterprise-addons:ro

    # Wichtig: beim offiziellen Image ist das Binary einfach "odoo"
    # Du kannst den command weglassen (nutzt Default), oder explizit mit -c starten:
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]

volumes:
  pg_data: {}
