services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  odoo:
    image: ${ODOO_IMAGE:-odoo-custom:latest}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    # WICHTIG: Directory-Mount, nicht einzelner File-Mount
    volumes:
      - ./config:/etc/odoo:ro
      # falls du lokale Addons mounten willst, lass diese Zeilen drin/füge sie hinzu:
      # - ./custom:/mnt/extra-addons:ro
      # - ./enterprise:/mnt/enterprise-addons:ro
    command: ["/opt/odoo/venv/bin/odoo", "-c", "/etc/odoo/odoo.conf"]

volumes:
  pg_data: {}
