services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: odoo_qs
    volumes:
      - pgdata_qs:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_qs"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config/qs/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data_qs:/var/lib/odoo
    # Start Odoo direkt mit der Konfiguration (kein wait-for-psql)
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
    restart: unless-stopped
    # Optional: QS auch von außen erreichbar machen (z.B. 8070)
    ports:
      - "8070:8069"

volumes:
  pgdata_qs: {}
  odoo_data_qs: {}
