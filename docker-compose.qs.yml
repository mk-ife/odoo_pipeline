version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: odoo_qs
    volumes:
      - qs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_qs"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    # ENV dienen als Quelle, Command nutzt sie für CLI-Start:
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: password
      DATABASE: odoo_qs
    # Start Odoo mit CLI-DB-Parametern (kein odoo.conf nötig)
    command:
      - bash
      - -lc
      - >
        exec odoo
        --db_host="$HOST"
        --db_port="$PORT"
        --db_user="$USER"
        --db_password="$PASSWORD"
    ports:
      - "8079:8069"
    volumes:
      - qs_odoo_data:/var/lib/odoo
      # Optionales Debug-Mount (nur wenn gewünscht):
      # - ./config/qs:/etc/odoo:ro
    restart: unless-stopped

volumes:
  qs_pgdata: {}
  qs_odoo_data: {}
