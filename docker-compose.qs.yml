services:
  db_qs:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: odoo18_qs
    volumes:
      - pgdata_qs:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  odoo_qs:
    image: odoo:18.0
    depends_on:
      db_qs:
        condition: service_healthy
    # Das offizielle odoo-Image erwartet DB_* Variablen (für wait-for-psql.py)
    environment:
      DB_HOST: db_qs
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: password
      DB_NAME: odoo18_qs
    ports:
      - "18069:8069"
    volumes:
      - odoo-data-qs:/var/lib/odoo
      - ./config_qs:/etc/odoo:ro
    restart: unless-stopped

volumes:
  pgdata_qs:
  odoo-data-qs:
