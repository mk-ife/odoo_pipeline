version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: odoo_qs
    volumes:
      - qs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_qs"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: password
      DATABASE: odoo_qs
    ports:
      - "8079:8069"
    volumes:
      - qs_odoo_data:/var/lib/odoo
      # WICHTIG: Mount exakt der Datei, nicht nur des Ordners
      - ./config/qs/odoo.conf:/etc/odoo/odoo.conf:ro
      # optional: eigene Addons:
      # - ./extra-addons:/mnt/extra-addons:ro
    restart: unless-stopped

volumes:
  qs_pgdata: {}
  qs_odoo_data: {}
